codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
    patch:
      default:
        target: auto
        threshold: 1%
        base: auto

# Mirrors the Vitest coverage excludes (vite.config.ts → test.coverage).
ignore:
  - "src/**/*.test.ts"
  - "src/**/*.test.tsx"
  - "src/test/**/*"
  - "src/main.tsx"
  - "src/vite-env.d.ts"
  - "dist/**/*"
  - "coverage/**/*"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: true
