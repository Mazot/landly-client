version: 2
updates:
  # npm: weekly, minor and patch updates grouped into one PR. A release has to be 14 days old before
  # Dependabot proposes it (the project's rule); security updates ignore the cooldown.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
